# Generated by: xcb ci generate --xcode 27 --runner xcode-27 --metal --target all
agents:
  queue: "default-queue"

steps:
  - label: ":swift: Lint"
    key: "lint"
    command: "swiftlint --strict"

  - label: ":metal: Test (macOS, {{matrix.configuration}})"
    key: "test"
    concurrency: 1
    concurrency_group: "metalsprocketsgltf/gpu-tests"
    env:
      MTL_DEBUG_LAYER: "1"
    matrix:
      setup:
        configuration:
          - "debug"
          - "release"
    command:
      - "swift build -c {{matrix.configuration}} --disable-sandbox"
      - "swift test -c {{matrix.configuration}} -Xswiftc -enable-testing --disable-sandbox"

  - label: ":hammer: Example ({{matrix.destination}}, {{matrix.configuration}})"
    key: "example"
    matrix:
      setup:
        destination:
          - "platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=xrOS"
        configuration:
          - "Debug"
          - "Release"
    command:
      - rm -rf .ci-spm
      - >-
        xcodebuild build
        -project Demos/GLTFViewer/GLTFViewer.xcodeproj
        -scheme GLTFViewer
        -configuration '{{matrix.configuration}}'
        -destination '{{matrix.destination}}'
        -clonedSourcePackagesDirPath .ci-spm
        -skipPackagePluginValidation
        -skipMacroValidation
        CODE_SIGNING_ALLOWED=NO

